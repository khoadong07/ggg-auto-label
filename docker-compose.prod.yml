version: '3.8'

services:
  ggg-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ggg-auto-mapping
    ports:
      - "8501:8501"
    volumes:
      - ggg-uploads:/tmp/ggg_uploads
      - ggg-outputs:/tmp/ggg_outputs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      # Tối ưu cho CPU
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      # Tắt warnings không cần thiết
      - TRANSFORMERS_VERBOSITY=error
      - TOKENIZERS_PARALLELISM=false
    restart: always
    # Resource limits cho production
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ggg-uploads:
    driver: local
  ggg-outputs:
    driver: local
