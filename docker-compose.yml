version: '3.8'

services:
  ggg-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ggg-auto-mapping
    ports:
      - "8532:8501"
    volumes:
      # Mount volumes để lưu trữ uploads và outputs
      - ggg-uploads:/tmp/ggg_uploads
      - ggg-outputs:/tmp/ggg_outputs
      # Mount code để development (comment out trong production)
      # - ./app.py:/app/app.py
      # - ./ggg_pipeline.py:/app/ggg_pipeline.py
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      # Tối ưu cho CPU
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      # Tắt warnings không cần thiết
      - TRANSFORMERS_VERBOSITY=error
      - TOKENIZERS_PARALLELISM=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ggg-uploads:
    driver: local
  ggg-outputs:
    driver: local
